<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch Together</title><link rel="stylesheet" href="./base.css"><link rel="stylesheet" href="./style.css"><script type="module" src="./main.mjs"></script></head><body><main><header class="masthead"><div><div class="eyebrow">WEBSPEAK · WATCH TOGETHER</div><h1 data-i18n="title"></h1><p data-i18n="lead"></p></div><div id="connection" class="connection"><i></i><span id="connection-text"></span></div></header><div id="notice" class="notice" role="status" hidden></div><div class="watch-grid"><section class="card player-card"><div class="stage"><video id="video" playsinline preload="metadata"></video><div id="empty-video"><span aria-hidden="true">▷</span><p data-i18n="emptyVideo"></p></div><button id="join-playback" class="primary" data-i18n="join" hidden></button></div><div class="player-controls"><div class="row"><button id="play" class="primary" data-i18n="play" disabled></button><span id="time" class="time">0:00 / 0:00</span><span id="sync" class="pill" aria-live="polite"></span></div><label class="seek-label"><span data-i18n="timeline"></span><input id="seek" type="range" min="0" max="1" step=".1" value="0" disabled></label><div class="row between"><label><span data-i18n="speed"></span><select id="rate"><option>.25</option><option>.5</option><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label><div class="row"><button id="mute" class="secondary" data-i18n="mute"></button><label class="volume-label"><span data-i18n="volume"></span><input id="volume" type="range" min="0" max="1" step=".05" value=".8"></label><button id="fullscreen" class="secondary" data-i18n="fullscreen"></button></div></div></div></section><aside class="card"><div class="row between"><h2 data-i18n="participants"></h2><span id="member-count" class="pill">0</span></div><p id="mode" class="muted"></p><div
